<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Dewa AI Studio</title>
  <style>
    :root {
      --page-bg: #dfe3e6;
      --panel-bg: #f4f1ee;
      --ink: #171614;
      --muted: #6d6a67;
      --green: #1d7d66;
      --soft-line: rgba(23, 22, 20, 0.18);
    }

    * { box-sizing: border-box; }

    html, body {
      margin: 0;
      min-height: 100%;
      background: var(--page-bg);
      font-family: Arial, Helvetica, sans-serif;
      color: var(--ink);
    }

    body {
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 32px;
    }

    .frame {
      width: min(1240px, 100%);
      background: var(--panel-bg);
      border: 4px solid var(--ink);
      border-radius: 26px;
      padding: 18px 18px 14px;
      box-shadow: 0 10px 0 rgba(0,0,0,0.08);
    }

    .topbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 18px;
      padding: 0 10px 12px;
    }

    .brand-wrap {
      display: flex;
      align-items: center;
      gap: 10px;
      min-width: 160px;
    }

    .brand-mark {
      width: 28px;
      height: 28px;
      border-radius: 50%;
      border: 2px solid var(--ink);
      position: relative;
      overflow: hidden;
      background: linear-gradient(135deg, #1d7d66 0%, #3a9f84 100%);
    }

    .brand-mark::before {
      content: "";
      position: absolute;
      inset: 5px 7px 8px 7px;
      border-radius: 50%;
      background: rgba(255,255,255,0.75);
      transform: rotate(-18deg);
    }

    .brand-mark::after {
      content: "";
      position: absolute;
      width: 14px;
      height: 14px;
      border-radius: 50%;
      right: 4px;
      bottom: 4px;
      background: rgba(0,0,0,0.08);
    }

    .nav {
      display: flex;
      align-items: center;
      gap: 22px;
      color: var(--muted);
      font-size: 12px;
      letter-spacing: 0.08em;
      text-transform: lowercase;
      font-weight: 600;
    }

    .nav span {
      opacity: 0.82;
    }

    .nav .active {
      color: var(--ink);
    }

    .status {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 11px;
      color: var(--ink);
      font-weight: 700;
    }

    .tiny-dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: #4d5a65;
      display: inline-block;
    }

    .hero-area {
      position: relative;
      overflow: hidden;
      height: 430px;
      border-radius: 18px 18px 0 0;
      background: #dfe8eb;
      border: 1px solid rgba(0,0,0,0.12);
      background-image: url('https://images.unsplash.com/photo-1524758631624-e2822e304c36?auto=format&fit=crop&w=1200&q=80');
      background-size: cover;
      background-position: center center;
    }

    .workspace-lights {
      position: absolute;
      left: 20px;
      top: 20px;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .light {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: rgba(19, 19, 19, 0.3);
    }

    .light:nth-child(2) { background: rgba(19,19,19,0.25); }
    .light:nth-child(3) { background: rgba(19,19,19,0.16); }

    .bottom-panel {
      display: grid;
      grid-template-columns: 1.25fr 1fr;
      align-items: end;
      gap: 18px;
      background: rgba(255,255,255,0.1);
      border-top: 1px solid var(--soft-line);
      padding: 18px 10px 0;
      min-height: 150px;
    }

    .copy {
      display: flex;
      flex-direction: column;
      justify-content: center;
      min-height: 150px;
      padding-left: 6px;
    }

    .meta-row {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 14px;
      color: var(--muted);
      font-size: 10px;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      font-weight: 700;
    }

    .meta-row .line {
      width: 30px;
      height: 1px;
      background: rgba(0,0,0,0.38);
    }

    .copy h2 {
      margin: 0;
      font-size: clamp(2.1rem, 2vw, 3.2rem);
      line-height: 1.03;
      letter-spacing: -0.06em;
      font-weight: 500;
      max-width: 560px;
      font-family: Georgia, "Times New Roman", serif;
    }

    .copy h2 strong {
      font-weight: 600;
    }

    .numbers {
      display: flex;
      justify-content: flex-end;
      align-items: flex-end;
      padding-bottom: 0;
    }

    .counter {
      font-size: clamp(6.6rem, 10vw, 12rem);
      line-height: 0.72;
      letter-spacing: -0.08em;
      font-weight: 700;
      color: var(--green);
      transform: translateY(10px);
      font-family: Arial, Helvetica, sans-serif;
    }

    @media (max-width: 900px) {
      .frame {
        padding: 16px 14px 12px;
      }

      .topbar {
        gap: 10px;
        flex-wrap: wrap;
      }

      .nav {
        order: 3;
        width: 100%;
        justify-content: flex-start;
        padding-left: 2px;
      }

      .bottom-panel {
        grid-template-columns: 1fr;
      }

      .numbers {
        justify-content: flex-start;
      }

      .hero-area {
        height: 300px;
      }
    }
  </style>
</head>
<body>
  <div class="frame">
    <div class="topbar">
      <div class="brand-wrap">
        <div class="brand-mark"></div>
      </div>

      <div class="nav">
        <span class="active">work</span>
        <span>studio</span>
        <span>journal</span>
        <span>contact</span>
      </div>

      <div class="status">
        <span class="tiny-dot"></span>
        <span>hello@dewa.ai</span>
      </div>
    </div>

    <div class="hero-area">
      <div class="workspace-lights">
        <span class="light"></span>
        <span class="light"></span>
        <span class="light"></span>
      </div>
    </div>

    <div class="bottom-panel">
      <div class="copy">
        <div class="meta-row">
          <span class="line"></span>
          <span>studio notes</span>
        </div>
        <h2>
          unanim. is not a regular structure, it's a studio and we are all composing it.
        </h2>
      </div>

      <div class="numbers">
        <div class="counter">95</div>
      </div>
    </div>
  </div>
</body>
</html>

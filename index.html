<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Dewa AI Studio</title>
  <style>
    :root {
      --bg: #dfe4e7;
      --panel: #f4f2f0;
      --ink: #1b1a19;
      --muted: #6e6a66;
      --green: #1d6d5d;
      --soft-line: rgba(27, 26, 25, 0.18);
    }

    * { box-sizing: border-box; }

    html, body {
      margin: 0;
      background: var(--bg);
      color: var(--ink);
      font-family: Arial, Helvetica, sans-serif;
      min-height: 100%;
    }

    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 28px;
    }

    .frame {
      width: min(1220px, 100%);
      background: var(--panel);
      border: 4px solid var(--ink);
      border-radius: 24px;
      box-shadow: 0 8px 0 rgba(0,0,0,0.08);
      padding: 18px 18px 14px;
    }

    .topbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 18px;
      padding: 0 10px 16px;
    }

    .brand {
      width: 36px;
      height: 36px;
      border-radius: 50%;
      border: 2px solid var(--ink);
      position: relative;
      background: linear-gradient(135deg, #0e7d66, #2f9a7b);
      overflow: hidden;
    }

    .brand::before {
      content: "";
      position: absolute;
      width: 16px;
      height: 16px;
      border-radius: 50%;
      background: rgba(255,255,255,0.7);
      top: 8px;
      left: 7px;
      transform: rotate(-18deg);
    }

    .brand::after {
      content: "";
      position: absolute;
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background: rgba(0,0,0,0.08);
      right: 4px;
      bottom: 4px;
    }

    .nav {
      display: flex;
      align-items: center;
      gap: 18px;
      font-size: 12px;
      letter-spacing: 0.08em;
      color: var(--muted);
      text-transform: lowercase;
      font-weight: 600;
      margin-left: auto;
      margin-right: auto;
    }

    .nav .active {
      color: var(--ink);
    }

    .status {
      display: flex;
      align-items: center;
      gap: 8px;
      color: var(--ink);
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.06em;
      text-transform: lowercase;
    }

    .status-dot {
      width: 9px;
      height: 9px;
      border-radius: 50%;
      background: rgba(27, 26, 25, 0.7);
      display: inline-block;
    }

    .hero {
      position: relative;
      height: 430px;
      border-radius: 18px 18px 0 0;
      border: 1px solid rgba(0,0,0,0.12);
      overflow: hidden;
      background: #dfe8eb;
      background-image: url('https://images.unsplash.com/photo-1524758631624-e2822e304c36?auto=format&fit=crop&w=1200&q=80');
      background-size: cover;
      background-position: center center;
    }

    .hero::before {
      content: "";
      position: absolute;
      inset: 0;
      background: rgba(255,255,255,0.02);
    }

    .windowbar {
      position: absolute;
      left: 20px;
      top: 18px;
      display: flex;
      gap: 8px;
      z-index: 1;
    }

    .dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: rgba(27, 26, 25, 0.25);
    }

    .bottom {
      display: grid;
      grid-template-columns: 1.2fr 0.8fr;
      align-items: end;
      gap: 18px;
      min-height: 170px;
      border-top: 1px solid var(--soft-line);
      padding: 18px 6px 0;
    }

    .copy {
      display: flex;
      flex-direction: column;
      justify-content: center;
      min-height: 150px;
      padding-left: 8px;
    }

    .meta {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 12px;
      color: var(--muted);
      font-size: 9px;
      font-weight: 700;
      letter-spacing: 0.18em;
      text-transform: uppercase;
    }

    .meta .line {
      width: 36px;
      height: 1px;
      background: rgba(27, 26, 25, 0.42);
      display: inline-block;
    }

    .copy h2 {
      margin: 0;
      max-width: 620px;
      font-size: clamp(2.2rem, 2vw, 3.1rem);
      line-height: 1.02;
      letter-spacing: -0.06em;
      font-family: Georgia, "Times New Roman", serif;
      font-weight: 400;
      color: var(--ink);
    }

    .copy h2 strong {
      font-weight: 500;
    }

    .number-wrap {
      display: flex;
      justify-content: flex-end;
      align-items: flex-end;
      min-height: 150px;
      padding-bottom: 0;
    }

    .number {
      font-size: clamp(7rem, 11vw, 12rem);
      line-height: 0.72;
      letter-spacing: -0.09em;
      font-weight: 700;
      color: var(--green);
      transform: translateY(10px);
      font-family: Arial, Helvetica, sans-serif;
      user-select: none;
    }

    @media (max-width: 860px) {
      .topbar {
        flex-wrap: wrap;
      }

      .nav {
        width: 100%;
        justify-content: flex-start;
        order: 3;
        margin: 0;
      }

      .hero {
        height: 300px;
      }

      .bottom {
        grid-template-columns: 1fr;
      }

      .number-wrap {
        justify-content: flex-start;
      }
    }
  </style>
</head>
<body>
  <div class="frame">
    <div class="topbar">
      <div class="brand" aria-label="brand logo"></div>

      <div class="nav" aria-label="main navigation">
        <span class="active">work</span>
        <span>studio</span>
        <span>journal</span>
        <span>contact</span>
      </div>

      <div class="status">
        <span class="status-dot"></span>
        <span>hello@dewa.ai</span>
      </div>
    </div>

    <div class="hero" aria-label="hero image">
      <div class="windowbar">
        <span class="dot"></span>
        <span class="dot"></span>
        <span class="dot"></span>
      </div>
    </div>

    <div class="bottom">
      <div class="copy">
        <div class="meta">
          <span class="line"></span>
          <span>studio notes</span>
        </div>
        <h2>
          unanim. is not a regular structure, it's a studio and we are all composing it.
        </h2>
      </div>

      <div class="number-wrap">
        <div class="number">95</div>
      </div>
    </div>
  </div>
</body>
</html>
